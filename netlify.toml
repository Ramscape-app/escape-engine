# Configuration Netlify — site statique servi depuis public/
[build]
  publish = "public"
  # Pas d'étape de build : ce sont des fichiers statiques prêts à servir.
  command = ""

# Fonctions serveur (accès admin, Supabase avec la clé de service).
# Netlify détecterait ce répertoire par convention, mais on le déclare
# pour que la configuration dise ce qui se passe réellement.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
