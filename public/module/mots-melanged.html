<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramscape — Mots mélangés</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:transparent;color:#eceef1;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:420px;margin:0 auto;padding:10px;text-align:center;--gap:5px}
  .title{font-size:.78rem;color:#aab0b8;letter-spacing:1px;margin-bottom:12px}
  /* Une ligne par mot. Auparavant toutes les lettres defilaient dans une seule
     rangee qui se coupait n'importe ou — au milieu d'un mot aussi souvent
     qu'entre deux — et la reponse devenait illisible des qu'elle en comptait
     plusieurs. */
  .slots{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-bottom:14px;min-height:48px}
  .mot{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;width:100%}
  /* La tuile retrecit juste assez pour que le mot le plus long tienne sur sa
     ligne. `--w` est calcule en pixels par `ajusterTuiles()` : un pourcentage
     place dans une variable se resout PAR PROPRIETE — celui de `width` sur la
     largeur, mais le meme relu dans `height` sur la hauteur, et les tuiles
     sortaient ecrasees. */
  .tile{width:var(--w,42px);height:calc(var(--w,42px) * 1.14);
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New',monospace;font-size:calc(var(--w,42px) * .55);font-weight:700;
    background:#3a3e45;border:1px solid #565b63;border-radius:8px;color:#eceef1;
    cursor:pointer;user-select:none;transition:transform .12s,background .15s}
  .tile:active{transform:scale(.9)}
  .tile.empty{background:#23262b;border-style:dashed;cursor:default}
  /* Un espace a l'interieur d'une ligne : une respiration, pas une case. */
  .ecart{width:calc(var(--w,42px) * .5);height:calc(var(--w,42px) * 1.14)}
  .bank{display:flex;flex-wrap:wrap;gap:var(--gap);justify-content:center;min-height:48px;width:100%;
    padding:10px;border:1px dashed #565b63;border-radius:10px;background:rgba(255,255,255,.02)}
  .lbl{font-size:.68rem;color:#8a909a;margin:10px 0 4px}
  .row{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .btn{background:#3a3e45;color:#eceef1;border:1px solid #565b63;border-radius:9px;padding:9px 16px;font-size:.82rem;cursor:pointer}
  .btn.primary{background:#2f6f5e;border-color:#3c8b76}
  .btn:active{transform:scale(.95)}
  .status{font-size:.9rem;font-weight:700;margin-top:10px;min-height:24px}
  .ok{color:#22d27a}.ko{color:#e2787f}
  .reveal{font-size:1.4rem;font-weight:800;letter-spacing:2px;color:#9ad0c0;
    background:#23262b;border:1px dashed #6fb7a3;border-radius:10px;padding:14px;margin-top:8px}
  .reveal-img{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title" id="title">Reconstituez le mot</div>
  <div class="lbl">VOTRE RÉPONSE</div>
  <div class="slots" id="slots"></div>
  <div class="lbl">LETTRES DISPONIBLES</div>
  <div class="bank" id="bank"></div>
  <div class="row">
    <button class="btn primary" id="submit">✓ Valider</button>
    <button class="btn" id="reset">↺ Recommencer</button>
  </div>
  <div class="status" id="status"></div>
  <div id="reveal-zone"></div>
</div>

<script>
const P = new URLSearchParams(location.search);
const WORD = (P.get('mot') || P.get('word') || 'EXEMPLE').toUpperCase();
const REVEAL = P.get('reveal');
const IMAGE  = P.get('image');
const VALIDATE = P.get('validate') === '1';
const TITLE = P.get('title');
if (TITLE) document.getElementById('title').textContent = TITLE;

// Les espaces ne sont pas des lettres a placer : ils separent les mots. Le
// joueur recevait une tuile vide a positionner, sans moyen de savoir ou — et
// une erreur dessus faisait echouer une reponse par ailleurs juste.
//
// Un retour a la ligne ecrit dans l'editeur = une ligne dans le jeu. C'est
// ainsi qu'on coupe un mot trop long, ou qu'on met deux mots courts cote a
// cote. Sans aucun retour, on retombe sur un mot par ligne : les jeux deja en
// ligne gardent exactement leur mise en page.
const LIGNES = (/\r?\n/.test(WORD) ? WORD.split(/\r?\n/) : WORD.split(/\s+/))
  .map(l => l.trim()).filter(Boolean);

// Chaque ligne devient un motif : une lettre a placer, ou un ecart. L'ecart
// occupe une demi-tuile et n'est pas cliquable.
const GROUPES = [];
{
  let i = 0;
  for (const ligne of LIGNES) {
    const motif = [];
    for (const c of ligne) {
      if (/\s/.test(c)) motif.push('ecart');
      else { motif.push('lettre'); i++; }
    }
    GROUPES.push({ debut: i - motif.filter(t => t === 'lettre').length, motif });
  }
}
const SOLUTION = LIGNES.join('').replace(/\s+/g, '');
const letters = SOLUTION.split('');

// La ligne la plus exigeante decide de la taille des tuiles : c'est elle qui
// doit tenir. Recalcule au changement d'orientation, sinon un telephone tourne
// garde des tuiles dimensionnees pour l'autre sens.
const UNITES = Math.max(1, ...GROUPES.map(g =>
  g.motif.reduce((n, t) => n + (t === 'ecart' ? 0.5 : 1), 0)));
const CASES = Math.max(1, ...GROUPES.map(g => g.motif.length));
function ajusterTuiles(){
  const wrap = document.querySelector('.wrap');
  const gap = 5;
  // 20 px : les marges interieures du cadre. 2 px de marge pour qu'un arrondi
  // ne fasse pas basculer la derniere lettre a la ligne.
  const dispo = wrap.clientWidth - 20 - 2;
  const brut = Math.floor((dispo - (CASES - 1) * gap) / UNITES);
  wrap.style.setProperty('--w', Math.max(18, Math.min(42, brut)) + 'px');
}
ajusterTuiles();
addEventListener('resize', ajusterTuiles);

let bank = [];
let slots = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function init(){
  let order;
  do { order = shuffle(letters.map((ch,i)=>({ch,id:i}))); }
  while (letters.length>1 && order.map(o=>o.ch).join('')===SOLUTION);
  bank = order;
  slots = letters.map(()=>null);
  document.getElementById('status').textContent='';
  document.getElementById('reveal-zone').innerHTML='';
  render();
}
function render(){
  document.getElementById('slots').innerHTML = GROUPES.map(g => {
    let k = g.debut, cases = '';
    for (const t of g.motif) {
      if (t === 'ecart') { cases += `<div class="ecart"></div>`; continue; }
      cases += slots[k]
        ? `<div class="tile" onclick="fromSlot(${k})">${slots[k].ch}</div>`
        : `<div class="tile empty"></div>`;
      k++;
    }
    return `<div class="mot">${cases}</div>`;
  }).join('');
  document.getElementById('bank').innerHTML = bank.map((b,i)=>
    `<div class="tile" onclick="toSlot(${i})">${b.ch}</div>`
  ).join('');
}
window.toSlot = function(bankIdx){
  const free = slots.findIndex(s=>s===null);
  if (free<0) return;
  slots[free] = bank[bankIdx];
  bank.splice(bankIdx,1);
  document.getElementById('status').textContent='';
  render();
};
window.fromSlot = function(slotIdx){
  if (!slots[slotIdx]) return;
  bank.push(slots[slotIdx]);
  slots[slotIdx] = null;
  document.getElementById('status').textContent='';
  render();
};
document.getElementById('submit').onclick = ()=>{
  const st = document.getElementById('status');
  const zone = document.getElementById('reveal-zone');
  const current = slots.map(s=>s?s.ch:'_').join('');
  if (slots.some(s=>s===null)){ st.className='status'; st.textContent='Placez toutes les lettres.'; return; }
  if (current === SOLUTION){
    st.className='status ok'; st.textContent='✓ Mot correct !';
    zone.innerHTML='';
    if (IMAGE){
      const img=document.createElement('img'); img.src=IMAGE; img.className='reveal-img'; img.alt='indice'; zone.appendChild(img);
    } else if (REVEAL){
      const d=document.createElement('div'); d.className='reveal'; d.textContent=REVEAL; zone.appendChild(d);
    }
    if (VALIDATE){ try{ window.parent.postMessage({type:'ramscape:solved', module:'mots-melanges'}, '*'); }catch(e){} }
  } else {
    st.className='status ko'; st.textContent='✗ Ce n\'est pas le bon mot.';
    zone.innerHTML='';
  }
};
document.getElementById('reset').onclick = init;
init();
</script>
</body>
</html>
