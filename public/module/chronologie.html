<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramscape — Remise en ordre</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:transparent;color:#eceef1;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{height:100%;max-width:460px;margin:0 auto;padding:10px;
    display:flex;flex-direction:column;gap:8px;text-align:center}
  .title{font-size:.78rem;color:#aab0b8;letter-spacing:1px;flex:none}
  /* La liste defile si elle est longue ; le reste de l'interface ne bouge pas. */
  .liste{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;
    padding:2px;text-align:left}
  .item{display:flex;align-items:center;gap:8px;background:#3a3e45;border:1px solid #565b63;
    border-radius:9px;padding:7px 8px;transition:background .15s,border-color .15s}
  .item.bouge{background:#2f6f5e;border-color:#3c8b76}
  .rang{flex:none;width:20px;font-family:'Courier New',monospace;font-size:.8rem;
    font-weight:700;color:#8a909a;text-align:center}
  .vignette{flex:none;width:38px;height:38px;object-fit:cover;border-radius:6px;
    border:1px solid #565b63;background:#23262b}
  .texte{flex:1;min-width:0;font-size:.82rem;line-height:1.25}
  /* Deux fleches plutot qu'un glisser-deposer : sur un telephone, un drag se
     confond avec le defilement de la page qui porte l'iframe. */
  .fleches{flex:none;display:flex;flex-direction:column;gap:3px}
  .fl{width:30px;height:21px;display:grid;place-items:center;background:#23262b;
    border:1px solid #565b63;border-radius:5px;color:#eceef1;font-size:.68rem;cursor:pointer}
  .fl:disabled{opacity:.3;cursor:default}
  .fl:active:not(:disabled){transform:scale(.92)}
  .row{display:flex;gap:8px;justify-content:center;flex:none}
  .btn{background:#3a3e45;color:#eceef1;border:1px solid #565b63;border-radius:9px;
    padding:9px 16px;font-size:.82rem;cursor:pointer}
  .btn.primary{background:#2f6f5e;border-color:#3c8b76}
  .btn:active{transform:scale(.95)}
  .status{font-size:.86rem;font-weight:700;min-height:20px;flex:none}
  .ok{color:#22d27a}.ko{color:#e2787f}
  .consigne{font-size:.7rem;color:#8a909a;flex:none}
  .reveal{font-size:1.2rem;font-weight:800;letter-spacing:2px;color:#9ad0c0;
    background:#23262b;border:1px dashed #6fb7a3;border-radius:10px;padding:10px;flex:none}
  .manque{display:grid;place-items:center;flex:1;font-size:.76rem;color:#8a909a;padding:16px;
    line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="title" id="title">Remettez dans l'ordre</div>
  <div class="consigne" id="consigne"></div>
  <div class="liste" id="liste"></div>
  <div class="row">
    <button class="btn primary" id="submit">✓ Valider</button>
    <button class="btn" id="reset">↺ Mélanger</button>
  </div>
  <div class="status" id="status"></div>
  <div id="reveal-zone"></div>
</div>

<script>
const P = new URLSearchParams(location.search);
const VALIDATE = P.get('validate') === '1';
const REVEAL = P.get('reveal');
const TITLE = P.get('title');
const CONSIGNE = P.get('consigne') || '';
// `aide=0` retire le nombre d'elements bien places : sans lui on peut avancer
// par ttonnements successifs, ce qui convient a un public occasionnel mais
// retire tout tranchant a une enigme difficile.
const AIDE = P.get('aide') !== '0';
if (TITLE) document.getElementById('title').textContent = TITLE;
document.getElementById('consigne').textContent = CONSIGNE;

// Une ligne = un element, dans le BON ordre. Une image facultative apres une
// barre verticale : « Le mariage | photos/mariage.jpg ».
const ITEMS = String(P.get('items') || '').split(/\r?\n/)
  .map(l => l.trim()).filter(Boolean)
  .map(l => {
    const barre = l.indexOf('|');
    return barre < 0
      ? { texte: l, image: '' }
      : { texte: l.slice(0, barre).trim(), image: l.slice(barre + 1).trim() };
  });

let ordre = [];   // indices d'ITEMS, dans l'ordre affiché

function melanger(n) {
  const a = [...Array(n).keys()];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  // Un melange qui retombe sur la solution offrirait l'enigme : on retire.
  // Deux elements seulement ne laissent qu'un seul autre arrangement.
  do { ordre = melanger(ITEMS.length); }
  while (ITEMS.length > 1 && ordre.every((v, i) => v === i));
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = 'status';
  document.getElementById('reveal-zone').innerHTML = '';
  rendre();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

function rendre(bouge) {
  document.getElementById('liste').innerHTML = ordre.map((idx, pos) => {
    const it = ITEMS[idx];
    return `<div class="item${bouge === pos ? ' bouge' : ''}">
      <span class="rang">${pos + 1}</span>
      ${it.image ? `<img class="vignette" src="${esc(it.image)}" alt=""
         onerror="this.style.visibility='hidden'">` : ''}
      <span class="texte">${esc(it.texte)}</span>
      <span class="fleches">
        <button class="fl" ${pos === 0 ? 'disabled' : ''} onclick="deplacer(${pos},-1)">▲</button>
        <button class="fl" ${pos === ordre.length - 1 ? 'disabled' : ''} onclick="deplacer(${pos},1)">▼</button>
      </span>
    </div>`;
  }).join('');
}

window.deplacer = function (pos, sens) {
  const cible = pos + sens;
  if (cible < 0 || cible >= ordre.length) return;
  [ordre[pos], ordre[cible]] = [ordre[cible], ordre[pos]];
  const st = document.getElementById('status');
  st.textContent = ''; st.className = 'status';
  rendre(cible);
};

document.getElementById('submit').onclick = () => {
  const st = document.getElementById('status');
  const zone = document.getElementById('reveal-zone');
  zone.innerHTML = '';
  const justes = ordre.filter((v, i) => v === i).length;
  if (justes === ITEMS.length) {
    st.className = 'status ok';
    st.textContent = '✓ Ordre correct !';
    if (REVEAL) {
      const d = document.createElement('div');
      d.className = 'reveal'; d.textContent = REVEAL; zone.appendChild(d);
    }
    if (VALIDATE) {
      try { window.parent.postMessage({ type: 'ramscape:solved', module: 'chronologie' }, '*'); }
      catch (e) {}
    }
  } else {
    st.className = 'status ko';
    st.textContent = AIDE
      ? `✗ ${justes} élément${justes > 1 ? 's' : ''} à la bonne place sur ${ITEMS.length}.`
      : '✗ Ce n\'est pas le bon ordre.';
  }
};
document.getElementById('reset').onclick = init;

if (!ITEMS.length) {
  document.getElementById('liste').outerHTML =
    '<div class="manque">Aucun élément à ordonner.<br>'
    + 'L\'organisateur doit en saisir au moins deux.</div>';
  document.getElementById('submit').disabled = true;
  console.error('chronologie : le paramètre « items » est vide.');
} else {
  init();
}
</script>
</body>
</html>
